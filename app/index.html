<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Leptospirosis forecasts and prophylaxis stock planning for the Philippines, starting with Quezon City and its barangays."
    />
    <title>LEPTON</title>
    <!-- The logo's O, in public/ (F12); ?v=2 makes browsers drop the cached three-bar icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <!-- Figtree, the font of every text style, at the three weights they use (tokens.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap"
    />
    <!-- Instrument Sans SemiBold, for the logo's wordmark only (Logo.css): just the five letters it sets -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&text=LEPTN&display=swap"
    />
  </head>
  <!-- Body/M is the default text style -->
  <body class="body-m">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
